<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>
  <!-- Prompt label -->
  <text x="16" y="22" font-family="Inter,sans-serif" font-size="11" fill="#64748B"
    font-style="italic">Wireframe: donne moi un page register</text>
  <!-- Elements -->
  
    <rect x="100" y="100" width="600" height="500" rx="8"
      fill="#f0f0f0"  opacity="0.95"/>
    <text x="400" y="350" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#9CA3AF"
      font-weight="400">container</text>
<text x="250" y="135" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter,sans-serif" font-size="11" fill="#E5E7EB" font-weight="500">Inscription</text>

    <rect x="150" y="200" width="300" height="40" rx="6"
      fill="#cccccc" stroke="#D1D5DB" stroke-width="1.5" opacity="0.95"/>
    <text x="300" y="220" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#374151"
      font-weight="400">Nom d'utilisateur</text>

    <rect x="150" y="260" width="300" height="40" rx="6"
      fill="#cccccc" stroke="#D1D5DB" stroke-width="1.5" opacity="0.95"/>
    <text x="300" y="280" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#374151"
      font-weight="400">Adresse e-mail</text>

    <rect x="150" y="320" width="300" height="40" rx="6"
      fill="#cccccc" stroke="#D1D5DB" stroke-width="1.5" opacity="0.95"/>
    <text x="300" y="340" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#374151"
