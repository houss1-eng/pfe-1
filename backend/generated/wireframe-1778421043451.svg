    <rect x="150" y="380" width="300" height="40" rx="6"
      fill="#cccccc" stroke="#D1D5DB" stroke-width="1.5" opacity="0.95"/>
    <text x="300" y="400" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#374151"
      font-weight="400">Confirmer le mot de passe</text>

    <rect x="250" y="440" width="150" height="40" rx="8"
      fill="#4CAF50"  opacity="0.95"/>
    <text x="325" y="460" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#ffffff"
