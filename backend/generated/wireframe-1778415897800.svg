<text x="400" y="175" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter,sans-serif" font-size="14" fill="#E5E7EB" font-weight="500">Connexion</text>

    <rect x="200" y="250" width="400" height="50" rx="6"
