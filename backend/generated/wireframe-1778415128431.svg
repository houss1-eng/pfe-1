<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>
  <!-- Prompt label -->
  <text x="16" y="22" font-family="Inter,sans-serif" font-size="11" fill="#64748B"
    font-style="italic">Wireframe: donne moi un page login</text>
  <!-- Elements -->
  
    <rect x="0" y="0" width="800" height="60" rx="4"
      fill="#4F46E5"  opacity="0.95"/>
    <text x="400" y="30" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#ffffff"
      font-weight="400">Logo | Accueil | À propos | …</text>
<text x="170" y="100" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter,sans-serif" font-size="14" fill="#E5E7EB" font-weight="500">Connexion</text>
<text x="70" y="140" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter,sans-serif" font-size="11" fill="#E5E7EB" font-weight="500">Email</text>

    <rect x="20" y="155" width="350" height="40" rx="6"
      fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" opacity="0.95"/>
    <text x="195" y="175" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#374151"
      font-weight="400">votre@email.com</text>

    <rect x="20" y="230" width="200" height="45" rx="8"
      fill="#10B981"  opacity="0.95"/>
    <text x="120" y="252.5" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,sans-serif" font-size="14" fill="#ffffff"
      font-weight="600">Se connecter</text>
</svg>